[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.12.
target-version = "py312"

# Directories to exclude from linting.
exclude = []

[tool.ruff.lint]
# F = Pyflakes; E4/E7/E9 = the meaningful pycodestyle error classes.
# (A blanket `select = ["ALL"]` was tried but dropped -- on this codebase it buries the
# real errors under hundreds of style nits.)
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow autofix for all enabled rules when `--fix` is used.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Use double quotes, like Black.
quote-style = "double"

# Indent with spaces, like Black.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Detect the appropriate line ending.
line-ending = "auto"

docstring-code-format = false
docstring-code-line-length = "dynamic"
